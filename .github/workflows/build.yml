name: build
on:
  push:
  pull_request:

jobs:
  build-and-full-server-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Clean compile
        run: gradle clean classes processResources --stacktrace
      - name: Reconstruct and repair alpha.82 base
        run: |
          set -euxo pipefail
          mkdir -p ci/reconstructed
          RAW='ci/reconstructed/god-villagers-0.1.0-alpha.82+mc26.2.raw.jar'
          BASE='ci/reconstructed/god-villagers-0.1.0-alpha.82+mc26.2.jar'
          cat ci/base82_base64/part_*.b64 | base64 -d > "$RAW"
          stat -c 'ALPHA82_RAW_SIZE=%s' "$RAW"
          sha256sum "$RAW"
          test "$(stat -c%s "$RAW")" = '24104'
          # The committed base64 snapshot has two damaged ZIP bytes around the old
          # SpecialistSpawnEggItem entry. Rebuild the central directory from local
          # headers; that class is replaced from the current clean compile below.
          zip -FF "$RAW" --out "$BASE"
          unzip -p "$BASE" fabric.mod.json | grep -F '0.1.0-alpha.82+mc26.2'
      - name: Verify alpha85 compiled overlay
        run: |
          set -euxo pipefail
          for f in build/classes/java/main/com/anjas/godvillagers/GodHorseRuntime.class build/classes/java/main/com/anjas/godvillagers/SpecialistSpawnEggItem.class build/classes/java/main/com/anjas/godvillagers/TaczEnchantRuntime.class build/classes/java/main/com/anjas/godvillagers/mixin/GodHorseLeashMixin.class build/classes/java/main/com/anjas/godvillagers/mixin/TaczBulletDamageMixin.class build/classes/java/main/com/anjas/godvillagers/mixin/TaczMagnetDeathMixin.class; do test -f "$f"; done
          test -f build/resources/main/godvillagers.mixins.json
      - name: Assemble alpha.85 from repaired alpha.82
        run: |
          python3 - <<'PY'
          import json,zipfile
          from pathlib import Path
          base=Path('ci/reconstructed/god-villagers-0.1.0-alpha.82+mc26.2.jar'); classes=Path('build/classes/java/main'); resources=Path('build/resources/main')
          replacements={'com/anjas/godvillagers/GodHorseRuntime.class':(classes/'com/anjas/godvillagers/GodHorseRuntime.class').read_bytes(),'com/anjas/godvillagers/SpecialistSpawnEggItem.class':(classes/'com/anjas/godvillagers/SpecialistSpawnEggItem.class').read_bytes()}
          extra={'com/anjas/godvillagers/TaczEnchantRuntime.class':(classes/'com/anjas/godvillagers/TaczEnchantRuntime.class').read_bytes(),'com/anjas/godvillagers/mixin/GodHorseLeashMixin.class':(classes/'com/anjas/godvillagers/mixin/GodHorseLeashMixin.class').read_bytes(),'com/anjas/godvillagers/mixin/TaczBulletDamageMixin.class':(classes/'com/anjas/godvillagers/mixin/TaczBulletDamageMixin.class').read_bytes(),'com/anjas/godvillagers/mixin/TaczMagnetDeathMixin.class':(classes/'com/anjas/godvillagers/mixin/TaczMagnetDeathMixin.class').read_bytes(),'godvillagers.mixins.json':(resources/'godvillagers.mixins.json').read_bytes()}
          for p in (resources/'data').rglob('*'):
              if p.is_file(): extra[p.relative_to(resources).as_posix()]=p.read_bytes()
          out=Path('build/full/god-villagers-0.1.0-alpha.85+mc26.2.jar'); out.parent.mkdir(parents=True,exist_ok=True)
          with zipfile.ZipFile(base) as zin,zipfile.ZipFile(out,'w') as zout:
              names=set()
              for info in zin.infolist():
                  if info.filename in replacements:
                      data=replacements[info.filename]
                  else:
                      data=zin.read(info.filename)
                  if info.filename=='fabric.mod.json':
                      meta=json.loads(data.decode());meta['version']='0.1.0-alpha.85+mc26.2';data=json.dumps(meta,indent=2).encode()
                  zout.writestr(info,data);names.add(info.filename)
              for name,data in extra.items():
                  if name not in names:zout.writestr(name,data)
          PY
          unzip -t build/full/god-villagers-0.1.0-alpha.85+mc26.2.jar
      - name: Prepare dedicated server
        run: |
          curl -fL --retry 3 -o fabric-installer.jar 'https://maven.fabricmc.net/net/fabricmc/fabric-installer/1.1.0/fabric-installer-1.1.0.jar'
          mkdir -p standalone && cd standalone
          java -jar ../fabric-installer.jar server -mcversion 26.2 -loader 0.19.3 -downloadMinecraft
          mkdir -p mods
          curl -fL --retry 3 -o mods/fabric-api.jar 'https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/0.159.0+26.2/fabric-api-0.159.0+26.2.jar'
          cp ../build/full/god-villagers-0.1.0-alpha.85+mc26.2.jar mods/
          printf 'eula=true\n' > eula.txt
      - name: Fast server smoke
        run: |
          cd standalone; set +e
          { sleep 25; echo 'say BASE82_REBUILD_ALIVE'; sleep 2; echo stop; } | timeout 60s java -Xms512M -Xmx1G -jar fabric-server-launch.jar nogui > ../server.log 2>&1
          code=${PIPESTATUS[1]}; set -e; cd ..; cat server.log
          ! grep -Eqi 'Mixin apply failed|InjectionError|InvalidInjectionException|Could not execute entrypoint|NoClassDefFoundError|ClassNotFoundException|VerifyError|Failed to start the minecraft server|Failed to load registry data' server.log
          grep -Eqi 'Done \(' server.log
          grep -Fq '[Server] BASE82_REBUILD_ALIVE' server.log
          if [ "$code" -ne 0 ] && [ "$code" -ne 124 ]; then exit "$code"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: god-villagers-alpha85-base82-fast
          path: build/full/god-villagers-0.1.0-alpha.85+mc26.2.jar
