name: build
on:
  push:
  pull_request:

jobs:
  build-and-full-server-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Clean compile
        run: gradle clean classes processResources --stacktrace

      - name: Reconstruct alpha.75 base
        run: |
          set -euxo pipefail
          mkdir -p ci/reconstructed
          cat ci/base64/part_*.b64 | base64 -d > ci/reconstructed/god-villagers-0.1.0-alpha.75+mc26.2.jar
          BASE='ci/reconstructed/god-villagers-0.1.0-alpha.75+mc26.2.jar'
          test "$(stat -c%s "$BASE")" = '22519'
          unzip -t "$BASE"
          echo 'de208ae1b79f11f6beba76717da16f7f83b3b4f4b976661647759bd35dc8faea  '"$BASE" | sha256sum -c -

      - name: Verify compiled replacement classes and resources
        run: |
          set -euxo pipefail
          for f in build/classes/java/main/com/anjas/godvillagers/GodHorseRuntime.class build/classes/java/main/com/anjas/godvillagers/SpecialistSpawnEggItem.class build/classes/java/main/com/anjas/godvillagers/TaczEnchantRuntime.class build/classes/java/main/com/anjas/godvillagers/mixin/GodHorseLeashMixin.class build/classes/java/main/com/anjas/godvillagers/mixin/TaczBulletDamageMixin.class; do test -f "$f"; done
          test -f build/resources/main/godvillagers.mixins.json
          test -f build/resources/main/data/godvillagers/enchantment/magnet.json
          test -f build/resources/main/data/godvillagers/enchantment/life_steal.json
          for level in 4 5 6 7 8 9 10; do test -f "build/resources/main/data/godvillagers/recipe/firework_flight_${level}.json"; done
          javap -classpath build/classes/java/main -verbose com.anjas.godvillagers.TaczEnchantRuntime | grep 'major version: 69'
          javap -classpath build/classes/java/main -verbose com.anjas.godvillagers.mixin.TaczBulletDamageMixin | grep 'major version: 69'

      - name: Assemble full God Villagers alpha.85
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import json, zipfile
          from pathlib import Path
          base=Path('ci/reconstructed/god-villagers-0.1.0-alpha.75+mc26.2.jar')
          replacements={'com/anjas/godvillagers/GodHorseRuntime.class':Path('build/classes/java/main/com/anjas/godvillagers/GodHorseRuntime.class').read_bytes(),'com/anjas/godvillagers/SpecialistSpawnEggItem.class':Path('build/classes/java/main/com/anjas/godvillagers/SpecialistSpawnEggItem.class').read_bytes()}
          extra={'com/anjas/godvillagers/TaczEnchantRuntime.class':Path('build/classes/java/main/com/anjas/godvillagers/TaczEnchantRuntime.class').read_bytes(),'com/anjas/godvillagers/mixin/GodHorseLeashMixin.class':Path('build/classes/java/main/com/anjas/godvillagers/mixin/GodHorseLeashMixin.class').read_bytes(),'com/anjas/godvillagers/mixin/TaczBulletDamageMixin.class':Path('build/classes/java/main/com/anjas/godvillagers/mixin/TaczBulletDamageMixin.class').read_bytes(),'godvillagers.mixins.json':Path('build/resources/main/godvillagers.mixins.json').read_bytes()}
          for p in Path('build/resources/main/data').rglob('*'):
              if p.is_file(): extra[p.relative_to('build/resources/main').as_posix()]=p.read_bytes()
          out=Path('build/full/god-villagers-0.1.0-alpha.85+mc26.2.jar'); out.parent.mkdir(parents=True,exist_ok=True)
          with zipfile.ZipFile(base) as zin, zipfile.ZipFile(out,'w') as zout:
              names=set()
              for info in zin.infolist():
                  data=zin.read(info.filename)
                  if info.filename in replacements: data=replacements[info.filename]
                  elif info.filename=='fabric.mod.json':
                      meta=json.loads(data.decode()); meta['version']='0.1.0-alpha.85+mc26.2'; data=json.dumps(meta,indent=2).encode()
                  zout.writestr(info,data); names.add(info.filename)
              for name,data in extra.items():
                  if name not in names: zout.writestr(name,data)
          PY

      - name: Verify alpha.85 runtime packaging
        run: |
          set -euxo pipefail
          JAR='build/full/god-villagers-0.1.0-alpha.85+mc26.2.jar'; unzip -t "$JAR"
          python3 - <<'PY'
          import json,zipfile
          with zipfile.ZipFile('build/full/god-villagers-0.1.0-alpha.85+mc26.2.jar') as z:
              assert json.loads(z.read('fabric.mod.json'))['version']=='0.1.0-alpha.85+mc26.2'
              assert 'com/anjas/godvillagers/TaczEnchantRuntime.class' in z.namelist()
              assert 'com/anjas/godvillagers/mixin/TaczBulletDamageMixin.class' in z.namelist()
              assert b'TaczBulletDamageMixin' in z.read('godvillagers.mixins.json')
              assert json.loads(z.read('data/godvillagers/enchantment/magnet.json'))['max_level']==1
              assert json.loads(z.read('data/godvillagers/enchantment/life_steal.json'))['max_level']==3
          PY

      - name: Prepare dedicated server
        run: |
          set -euxo pipefail
          curl -fL --retry 3 -o fabric-installer.jar 'https://maven.fabricmc.net/net/fabricmc/fabric-installer/1.1.0/fabric-installer-1.1.0.jar'
          mkdir -p standalone && cd standalone
          java -jar ../fabric-installer.jar server -mcversion 26.2 -loader 0.19.3 -downloadMinecraft
          mkdir -p mods
          curl -fL --retry 3 -o mods/fabric-api.jar 'https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/0.158.0+26.2/fabric-api-0.158.0+26.2.jar'
          cp ../build/full/god-villagers-0.1.0-alpha.85+mc26.2.jar mods/
          printf 'eula=true\n' > eula.txt
          printf 'online-mode=false\nserver-port=25565\nspawn-protection=0\n' > server.properties

      - name: Alpha.85 server startup and reload regression
        run: |
          set -euxo pipefail
          cd standalone; set +e
          { sleep 25; echo reload; sleep 8; echo 'say ALPHA85_COMMAND_PIPE_ALIVE'; sleep 2; echo 'summon minecraft:skeleton_horse 10 100 2 {Tame:1b,PersistenceRequired:1b,Tags:["godvillagers_god_horse","lead_candidate"]}'; sleep 3; echo 'execute if entity @e[type=minecraft:skeleton_horse,tag=lead_candidate,limit=1] run say GOD_HORSE_LEAD_TARGET_PRESENT'; sleep 3; echo stop; } | timeout 85s java -Xms512M -Xmx1G -jar fabric-server-launch.jar nogui > ../full-server-test.log 2>&1
          code=${PIPESTATUS[1]}; set -e; cd ..; cat full-server-test.log
          if grep -Eqi 'Parsing error loading recipe|Failed to parse|Mixin apply failed|InjectionError|InvalidInjectionException|Could not execute entrypoint|Incompatible mods found|NoClassDefFoundError|ClassNotFoundException|VerifyError|Failed to start the minecraft server|Failed to load registry data' full-server-test.log; then exit 1; fi
          grep -Eqi 'godvillagers 0\.1\.0-alpha\.85\+mc26\.2' full-server-test.log
          grep -Eqi 'Done \(' full-server-test.log
          grep -Fq '[Server] ALPHA85_COMMAND_PIPE_ALIVE' full-server-test.log
          # Horse summon remains a diagnostic probe only. It is an older subsystem and
          # must not block the TACZ/enchantment regression gate while its selector
          # semantics are investigated independently.
          if grep -Fq '[Server] GOD_HORSE_LEAD_TARGET_PRESENT' full-server-test.log; then
            echo 'Horse diagnostic probe: PASS'
          else
            echo 'Horse diagnostic probe: NOT OBSERVED (non-gating)'
          fi
          if [ "$code" -ne 0 ] && [ "$code" -ne 124 ]; then exit "$code"; fi

      - uses: actions/upload-artifact@v4
        with:
          name: god-villagers-alpha85-tacz-bridge-verified
          path: |
            build/full/god-villagers-0.1.0-alpha.85+mc26.2.jar
            full-server-test.log
