name: build
on:
  push:
  pull_request:

jobs:
  build-and-full-server-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Clean compile and regression tests
        run: gradle clean test classes processResources --stacktrace
      - name: Reconstruct and repair alpha.82 base
        run: |
          set -euxo pipefail
          mkdir -p ci/reconstructed
          RAW='ci/reconstructed/god-villagers-0.1.0-alpha.82+mc26.2.raw.jar'
          BASE='ci/reconstructed/god-villagers-0.1.0-alpha.82+mc26.2.jar'
          cat ci/base82_base64/part_*.b64 | base64 -d > "$RAW"
          test "$(stat -c%s "$RAW")" = '24104'
          zip -FF "$RAW" --out "$BASE"
          unzip -p "$BASE" fabric.mod.json | grep -F '0.1.0-alpha.82+mc26.2'
      - name: Verify alpha85 compiled overlay
        run: |
          set -euxo pipefail
          for f in build/classes/java/main/com/anjas/godvillagers/GodHorseRuntime.class build/classes/java/main/com/anjas/godvillagers/SpecialistSpawnEggItem.class build/classes/java/main/com/anjas/godvillagers/TaczEnchantRuntime.class build/classes/java/main/com/anjas/godvillagers/TaczDirectEventRuntime.class build/classes/java/main/com/anjas/godvillagers/TaczBridgeBootstrap.class build/classes/java/main/com/anjas/godvillagers/mixin/GodHorseLeashMixin.class build/classes/java/main/com/anjas/godvillagers/mixin/TaczInitMixin.class; do test -f "$f"; done
          test -f build/resources/main/godvillagers.mixins.json
      - name: Assemble alpha.85 from repaired alpha.82
        run: |
          python3 - <<'PY'
          import json,zipfile
          from pathlib import Path
          base=Path('ci/reconstructed/god-villagers-0.1.0-alpha.82+mc26.2.jar'); classes=Path('build/classes/java/main'); resources=Path('build/resources/main')
          replacements={'com/anjas/godvillagers/GodHorseRuntime.class':(classes/'com/anjas/godvillagers/GodHorseRuntime.class').read_bytes(),'com/anjas/godvillagers/SpecialistSpawnEggItem.class':(classes/'com/anjas/godvillagers/SpecialistSpawnEggItem.class').read_bytes()}
          extra={
            'com/anjas/godvillagers/TaczEnchantRuntime.class':(classes/'com/anjas/godvillagers/TaczEnchantRuntime.class').read_bytes(),
            'com/anjas/godvillagers/TaczDirectEventRuntime.class':(classes/'com/anjas/godvillagers/TaczDirectEventRuntime.class').read_bytes(),
            'com/anjas/godvillagers/TaczBridgeBootstrap.class':(classes/'com/anjas/godvillagers/TaczBridgeBootstrap.class').read_bytes(),
            'com/anjas/godvillagers/mixin/GodHorseLeashMixin.class':(classes/'com/anjas/godvillagers/mixin/GodHorseLeashMixin.class').read_bytes(),
            'com/anjas/godvillagers/mixin/TaczInitMixin.class':(classes/'com/anjas/godvillagers/mixin/TaczInitMixin.class').read_bytes(),
            'godvillagers.mixins.json':(resources/'godvillagers.mixins.json').read_bytes()
          }
          for p in (resources/'data').rglob('*'):
              if p.is_file(): extra[p.relative_to(resources).as_posix()]=p.read_bytes()
          out=Path('build/full/god-villagers-0.1.0-alpha.85+mc26.2.jar'); out.parent.mkdir(parents=True,exist_ok=True)
          with zipfile.ZipFile(base) as zin,zipfile.ZipFile(out,'w') as zout:
              names=set()
              for info in zin.infolist():
                  if info.filename in replacements: data=replacements[info.filename]
                  else: data=zin.read(info.filename)
                  if info.filename=='fabric.mod.json':
                      meta=json.loads(data.decode());meta['version']='0.1.0-alpha.85+mc26.2'
                      entrypoints=meta.setdefault('entrypoints',{}); main=entrypoints.setdefault('main',[])
                      if isinstance(main,str): main=[main]; entrypoints['main']=main
                      bridge='com.anjas.godvillagers.TaczBridgeBootstrap'
                      if bridge not in main: main.append(bridge)
                      data=json.dumps(meta,indent=2).encode()
                  zout.writestr(info,data);names.add(info.filename)
              for name,data in extra.items():
                  if name not in names:zout.writestr(name,data)
          PY
          unzip -t build/full/god-villagers-0.1.0-alpha.85+mc26.2.jar
      - name: Verify final alpha85 artifact
        run: |
          set -euxo pipefail
          JAR='build/full/god-villagers-0.1.0-alpha.85+mc26.2.jar'
          unzip -t "$JAR"
          unzip -p "$JAR" fabric.mod.json | grep -F '0.1.0-alpha.85+mc26.2'
          unzip -p "$JAR" fabric.mod.json | grep -F 'com.anjas.godvillagers.TaczBridgeBootstrap'
          for entry in com/anjas/godvillagers/GodHorseRuntime.class com/anjas/godvillagers/SpecialistSpawnEggItem.class com/anjas/godvillagers/TaczEnchantRuntime.class com/anjas/godvillagers/TaczDirectEventRuntime.class com/anjas/godvillagers/TaczBridgeBootstrap.class com/anjas/godvillagers/mixin/GodHorseLeashMixin.class com/anjas/godvillagers/mixin/TaczInitMixin.class godvillagers.mixins.json data/godvillagers/tags/item/tacz_enchantable.json; do
            unzip -Z1 "$JAR" | grep -Fx "$entry"
            test "$(unzip -Z1 "$JAR" | grep -Fxc "$entry")" = '1'
          done
          unzip -p "$JAR" godvillagers.mixins.json | grep -F 'TaczInitMixin'
          ! unzip -p "$JAR" godvillagers.mixins.json | grep -Eq 'TaczBulletDamageMixin|TaczMagnetDeathMixin|TaczHurtEventMixin|TaczKillEventMixin'
          sha256sum "$JAR"
      - name: Prepare dedicated server with real TACZ R2-hotfix2
        run: |
          set -euxo pipefail
          curl -fL --retry 3 -o fabric-installer.jar 'https://maven.fabricmc.net/net/fabricmc/fabric-installer/1.1.0/fabric-installer-1.1.0.jar'
          mkdir -p standalone && cd standalone
          java -jar ../fabric-installer.jar server -mcversion 26.2 -loader 0.19.3 -downloadMinecraft
          mkdir -p mods
          curl -fL --retry 3 -o mods/fabric-api.jar 'https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/0.159.0+26.2/fabric-api-0.159.0+26.2.jar'
          curl -fL --retry 3 -o mods/forge-config-api-port.jar 'https://api.modrinth.com/maven/maven/modrinth/ohNO6lps/rSd3GiG8/ohNO6lps-rSd3GiG8.jar'
          unzip -p mods/forge-config-api-port.jar fabric.mod.json | grep -F '26.2.1'
          curl -fL --retry 3 -o mods/tacz.jar 'https://mediafilez.forgecdn.net/files/8750/678/TACZ-Refabricated-26.2-1.1.8%2Bfabric.26.2.R2-hotfix2.jar'
          test "$(stat -c%s mods/tacz.jar)" -gt 50000000
          unzip -p mods/tacz.jar fabric.mod.json | grep -F '1.1.8+fabric.26.2.R2-hotfix2'
          cp ../build/full/god-villagers-0.1.0-alpha.85+mc26.2.jar mods/
          printf 'eula=true\n' > eula.txt
          printf 'online-mode=false\nlevel-name=world\n' > server.properties
      - name: TACZ dedicated-server compatibility smoke
        run: |
          cd standalone; set +e
          { sleep 40; echo 'say TACZ_ALPHA85_RUNTIME_ALIVE'; sleep 2; echo stop; } | timeout 85s java -Xms512M -Xmx1500M -jar fabric-server-launch.jar nogui > ../server.log 2>&1
          code=${PIPESTATUS[1]}; set -e; cd ..; cat server.log
          ! grep -Eqi 'Mixin apply failed|InjectionError|InvalidInjectionException|Could not execute entrypoint|NoClassDefFoundError|ClassNotFoundException|VerifyError|Failed to start the minecraft server|Failed to load registry data|Incompatible mods found' server.log
          grep -Fq 'godvillagers 0.1.0-alpha.85+mc26.2' server.log
          grep -Fq 'tacz 1.1.8+fabric.26.2.R2-hotfix2' server.log
          grep -Fq 'forgeconfigapiport 26.2.1' server.log
          grep -Fq 'LRTactical (unofficial 26.2 port) initialized' server.log
          grep -Fq '[God Villagers] TACZ direct hit/kill event bridge registered' server.log
          grep -Eqi 'Done \(' server.log
          grep -Fq '[Server] TACZ_ALPHA85_RUNTIME_ALIVE' server.log
          if [ "$code" -ne 0 ] && [ "$code" -ne 124 ]; then exit "$code"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: god-villagers-alpha85-tacz-runtime-smoke
          path: build/full/god-villagers-0.1.0-alpha.85+mc26.2.jar
