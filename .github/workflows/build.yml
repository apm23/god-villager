name: build
on:
  push:
  pull_request:

jobs:
  build-and-full-server-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Clean compile
        run: gradle clean classes --stacktrace

      - name: Reconstruct and verify alpha.75 base
        run: |
          set -euxo pipefail
          mkdir -p ci/reconstructed
          cat ci/base64/part_*.b64 | base64 -d > ci/reconstructed/god-villagers-0.1.0-alpha.75+mc26.2.jar
          BASE='ci/reconstructed/god-villagers-0.1.0-alpha.75+mc26.2.jar'
          test -f "$BASE"
          test "$(stat -c%s "$BASE")" = '22519'
          unzip -t "$BASE"
          echo 'de208ae1b79f11f6beba76717da16f7f83b3b4f4b976661647759bd35dc8faea  '"$BASE" | sha256sum -c -

      - name: Verify compiled horse class
        run: |
          set -euxo pipefail
          CLASS='build/classes/java/main/com/anjas/godvillagers/GodHorseRuntime.class'
          test -f "$CLASS"
          javap -classpath build/classes/java/main -verbose com.anjas.godvillagers.GodHorseRuntime | grep 'major version: 69'

      - name: Assemble full God Villagers alpha.78
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import json, zipfile
          from pathlib import Path
          base = Path('ci/reconstructed/god-villagers-0.1.0-alpha.75+mc26.2.jar')
          horse = Path('build/classes/java/main/com/anjas/godvillagers/GodHorseRuntime.class').read_bytes()
          out = Path('build/full/god-villagers-0.1.0-alpha.78+mc26.2.jar')
          out.parent.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(base, 'r') as zin, zipfile.ZipFile(out, 'w') as zout:
              for info in zin.infolist():
                  data = zin.read(info.filename)
                  if info.filename == 'com/anjas/godvillagers/GodHorseRuntime.class':
                      data = horse
                  elif info.filename == 'fabric.mod.json':
                      meta = json.loads(data.decode('utf-8'))
                      if meta.get('id') != 'godvillagers': raise SystemExit('unexpected base mod id')
                      meta['version'] = '0.1.0-alpha.78+mc26.2'
                      data = json.dumps(meta, ensure_ascii=False, indent=2).encode('utf-8')
                  zout.writestr(info, data)
          PY

      - name: Verify full jar identity and contents
        run: |
          set -euxo pipefail
          JAR='build/full/god-villagers-0.1.0-alpha.78+mc26.2.jar'
          unzip -t "$JAR"
          python3 - <<'PY'
          import hashlib, json, zipfile
          from pathlib import Path
          jar = Path('build/full/god-villagers-0.1.0-alpha.78+mc26.2.jar')
          compiled = Path('build/classes/java/main/com/anjas/godvillagers/GodHorseRuntime.class').read_bytes()
          with zipfile.ZipFile(jar) as z:
              names = z.namelist()
              assert len(names) == 28
              meta = json.loads(z.read('fabric.mod.json'))
              assert meta['id'] == 'godvillagers'
              assert meta['version'] == '0.1.0-alpha.78+mc26.2'
              assert z.read('com/anjas/godvillagers/GodHorseRuntime.class') == compiled
              assert 'godvillagers.mixins.json' not in names
              assert not any('GodHorseOptimizedMixin' in n for n in names)
          print('full_jar_sha256=' + hashlib.sha256(jar.read_bytes()).hexdigest())
          PY

      - name: Prepare standalone Fabric dedicated server
        run: |
          set -euxo pipefail
          curl -fL --retry 3 -o fabric-installer.jar 'https://maven.fabricmc.net/net/fabricmc/fabric-installer/1.1.0/fabric-installer-1.1.0.jar'
          mkdir -p standalone
          cd standalone
          java -jar ../fabric-installer.jar server -mcversion 26.2 -loader 0.19.3 -downloadMinecraft
          mkdir -p mods
          curl -fL --retry 3 -o mods/fabric-api.jar 'https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/0.158.0+26.2/fabric-api-0.158.0+26.2.jar'
          cp ../build/full/god-villagers-0.1.0-alpha.78+mc26.2.jar mods/
          printf 'eula=true\n' > eula.txt
          printf 'online-mode=false\nserver-port=25565\nspawn-protection=0\n' > server.properties

      - name: Full jar startup and God Horse functional test
        run: |
          set -euxo pipefail
          cd standalone
          set +e
          {
            sleep 25
            echo 'forceload add 0 0 14 4'
            sleep 3
            echo 'fill 0 90 0 4 100 4 minecraft:water'
            echo 'fill 10 90 0 14 100 4 minecraft:lava'
            echo 'summon minecraft:skeleton_horse 2 108 2 {Tame:1b,PersistenceRequired:1b,Tags:["godvillagers_god_horse","water_fall_test"]}'
            echo 'summon minecraft:skeleton_horse 12 108 2 {Tame:1b,PersistenceRequired:1b,Tags:["godvillagers_god_horse","lava_fall_test"]}'
            sleep 7
            echo 'data get entity @e[type=minecraft:skeleton_horse,tag=water_fall_test,limit=1] Pos'
            echo 'data get entity @e[type=minecraft:skeleton_horse,tag=lava_fall_test,limit=1] Pos'
            echo 'execute if entity @e[type=minecraft:skeleton_horse,tag=water_fall_test,y=100,dy=2] run say GOD_HORSE_WATER_FALL_PASS'
            echo 'execute if entity @e[type=minecraft:skeleton_horse,tag=lava_fall_test,y=100,dy=2] run say GOD_HORSE_LAVA_FALL_PASS'
            echo 'data merge entity @e[type=minecraft:skeleton_horse,tag=water_fall_test,limit=1] {Motion:[0.0d,1.2d,0.0d]}'
            sleep 7
            echo 'data get entity @e[type=minecraft:skeleton_horse,tag=water_fall_test,limit=1] Pos'
            echo 'execute if entity @e[type=minecraft:skeleton_horse,tag=water_fall_test,y=100,dy=2] run say GOD_HORSE_JUMP_RETURN_PASS'
            echo 'tp @e[type=minecraft:skeleton_horse,tag=water_fall_test,limit=1] 2 95 2'
            sleep 3
            echo 'data get entity @e[type=minecraft:skeleton_horse,tag=water_fall_test,limit=1] Pos'
            echo 'execute if entity @e[type=minecraft:skeleton_horse,tag=water_fall_test,y=100,dy=2] run say GOD_HORSE_DEEP_RECOVERY_PASS'
            echo 'stop'
          } | timeout 80s java -Xms512M -Xmx1G -jar fabric-server-launch.jar nogui > ../full-server-test.log 2>&1
          code=${PIPESTATUS[1]}
          set -e
          cd ..
          cat full-server-test.log
          if grep -Eqi 'Mixin apply failed|Could not execute entrypoint|Incompatible mods found|MixinTransformerError|BootstrapMethodError|Failed to start the minecraft server|NoClassDefFoundError|ClassNotFoundException|VerifyError' full-server-test.log; then exit 1; fi
          grep -Eqi 'godvillagers 0\.1\.0-alpha\.78\+mc26\.2' full-server-test.log
          ! grep -Eqi 'godvillagersoptimizer' full-server-test.log
          grep -Eqi 'Done \(' full-server-test.log
          grep -Fq 'GOD_HORSE_WATER_FALL_PASS' full-server-test.log
          grep -Fq 'GOD_HORSE_LAVA_FALL_PASS' full-server-test.log
          grep -Fq 'GOD_HORSE_JUMP_RETURN_PASS' full-server-test.log
          grep -Fq 'GOD_HORSE_DEEP_RECOVERY_PASS' full-server-test.log
          if [ "$code" -ne 0 ] && [ "$code" -ne 124 ]; then exit "$code"; fi

      - uses: actions/upload-artifact@v4
        with:
          name: god-villagers-alpha78-full-function-verified
          path: |
            build/full/god-villagers-0.1.0-alpha.78+mc26.2.jar
            full-server-test.log
