name: build
on:
  push:
  pull_request:

jobs:
  build-and-full-server-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Clean compile
        run: gradle clean classes --stacktrace

      - name: Reconstruct alpha.75 base
        run: |
          set -euxo pipefail
          mkdir -p ci/reconstructed
          cat ci/base64/part_*.b64 | base64 -d > ci/reconstructed/god-villagers-0.1.0-alpha.75+mc26.2.jar
          BASE='ci/reconstructed/god-villagers-0.1.0-alpha.75+mc26.2.jar'
          test "$(stat -c%s "$BASE")" = '22519'
          unzip -t "$BASE"
          echo 'de208ae1b79f11f6beba76717da16f7f83b3b4f4b976661647759bd35dc8faea  '"$BASE" | sha256sum -c -

      - name: Verify compiled replacement classes
        run: |
          set -euxo pipefail
          test -f build/classes/java/main/com/anjas/godvillagers/GodHorseRuntime.class
          test -f build/classes/java/main/com/anjas/godvillagers/SpecialistSpawnEggItem.class
          test -f build/classes/java/main/com/anjas/godvillagers/mixin/GodHorseLeashMixin.class
          test -f build/resources/main/godvillagers.mixins.json
          javap -classpath build/classes/java/main -verbose com.anjas.godvillagers.GodHorseRuntime | grep 'major version: 69'
          javap -classpath build/classes/java/main -verbose com.anjas.godvillagers.SpecialistSpawnEggItem | grep 'major version: 69'
          javap -classpath build/classes/java/main -verbose com.anjas.godvillagers.mixin.GodHorseLeashMixin | grep 'major version: 69'
          grep -F 'GodHorseLeashMixin' build/resources/main/godvillagers.mixins.json

      - name: Assemble full God Villagers alpha.83
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import json, zipfile
          from pathlib import Path
          base=Path('ci/reconstructed/god-villagers-0.1.0-alpha.75+mc26.2.jar')
          replacements={
            'com/anjas/godvillagers/GodHorseRuntime.class': Path('build/classes/java/main/com/anjas/godvillagers/GodHorseRuntime.class').read_bytes(),
            'com/anjas/godvillagers/SpecialistSpawnEggItem.class': Path('build/classes/java/main/com/anjas/godvillagers/SpecialistSpawnEggItem.class').read_bytes(),
            'godvillagers.mixins.json': Path('build/resources/main/godvillagers.mixins.json').read_bytes(),
          }
          extra={
            'com/anjas/godvillagers/mixin/GodHorseLeashMixin.class': Path('build/classes/java/main/com/anjas/godvillagers/mixin/GodHorseLeashMixin.class').read_bytes(),
          }
          out=Path('build/full/god-villagers-0.1.0-alpha.83+mc26.2.jar')
          out.parent.mkdir(parents=True,exist_ok=True)
          with zipfile.ZipFile(base) as zin, zipfile.ZipFile(out,'w') as zout:
              names=set()
              for info in zin.infolist():
                  data=zin.read(info.filename)
                  if info.filename in replacements: data=replacements[info.filename]
                  elif info.filename=='fabric.mod.json':
                      meta=json.loads(data.decode()); assert meta['id']=='godvillagers'
                      meta['version']='0.1.0-alpha.83+mc26.2'; data=json.dumps(meta,indent=2).encode()
                  zout.writestr(info,data); names.add(info.filename)
              for name,data in extra.items():
                  if name not in names: zout.writestr(name,data)
          PY

      - name: Verify full jar and alpha.83 leash mixin
        run: |
          set -euxo pipefail
          JAR='build/full/god-villagers-0.1.0-alpha.83+mc26.2.jar'
          unzip -t "$JAR"
          python3 - <<'PY'
          import json,zipfile,hashlib
          from pathlib import Path
          jar=Path('build/full/god-villagers-0.1.0-alpha.83+mc26.2.jar')
          with zipfile.ZipFile(jar) as z:
              m=json.loads(z.read('fabric.mod.json')); assert m['id']=='godvillagers' and m['version']=='0.1.0-alpha.83+mc26.2'
              assert z.read('com/anjas/godvillagers/GodHorseRuntime.class')==Path('build/classes/java/main/com/anjas/godvillagers/GodHorseRuntime.class').read_bytes()
              assert z.read('com/anjas/godvillagers/SpecialistSpawnEggItem.class')==Path('build/classes/java/main/com/anjas/godvillagers/SpecialistSpawnEggItem.class').read_bytes()
              assert z.read('com/anjas/godvillagers/mixin/GodHorseLeashMixin.class')==Path('build/classes/java/main/com/anjas/godvillagers/mixin/GodHorseLeashMixin.class').read_bytes()
              assert b'GodHorseLeashMixin' in z.read('godvillagers.mixins.json')
          print('jar_sha256='+hashlib.sha256(jar.read_bytes()).hexdigest())
          PY
          javap -classpath "$JAR" -p -constants com.anjas.godvillagers.SpecialistSpawnEggItem > alpha83-javap.txt
          javap -classpath "$JAR" -p com.anjas.godvillagers.mixin.GodHorseLeashMixin >> alpha83-javap.txt
          grep -F 'luck_of_the_sea:6,lure:10,unbreaking:3,mending:2' alpha83-javap.txt
          grep -F 'unbreaking:4,mending:3,thorns:5' alpha83-javap.txt
          grep -F 'godvillagers$allowGodHorseLeash' alpha83-javap.txt

      - name: Prepare dedicated server
        run: |
          set -euxo pipefail
          curl -fL --retry 3 -o fabric-installer.jar 'https://maven.fabricmc.net/net/fabricmc/fabric-installer/1.1.0/fabric-installer-1.1.0.jar'
          mkdir -p standalone && cd standalone
          java -jar ../fabric-installer.jar server -mcversion 26.2 -loader 0.19.3 -downloadMinecraft
          mkdir -p mods
          curl -fL --retry 3 -o mods/fabric-api.jar 'https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/0.158.0+26.2/fabric-api-0.158.0+26.2.jar'
          cp ../build/full/god-villagers-0.1.0-alpha.83+mc26.2.jar mods/
          printf 'eula=true\n' > eula.txt
          printf 'online-mode=false\nserver-port=25565\nspawn-protection=0\n' > server.properties

      - name: Alpha.83 lead mixin and horse regression test
        run: |
          set -euxo pipefail
          cd standalone
          set +e
          {
            sleep 25
            echo 'forceload add 0 0 44 4'
            sleep 3
            echo 'fill 20 95 0 24 95 4 minecraft:water'
            echo 'fill 30 90 0 34 100 4 minecraft:water'
            echo 'summon minecraft:skeleton_horse 10 100 2 {Tame:1b,PersistenceRequired:1b,Tags:["godvillagers_god_horse","lead_candidate"]}'
            echo 'summon minecraft:skeleton_horse 14 100 2 {Tame:1b,PersistenceRequired:1b,Tags:["normal_control"]}'
            echo 'summon minecraft:skeleton_horse 22 94.5 2 {Tame:1b,PersistenceRequired:1b,Tags:["godvillagers_god_horse","ridden_half"],Passengers:[{id:"minecraft:armor_stand",NoGravity:1b,Invisible:1b,Tags:["rider_proxy"]}]}'
            echo 'summon minecraft:skeleton_horse 32 108 2 {Tame:1b,PersistenceRequired:1b,Tags:["godvillagers_god_horse","ridden_jump"],Motion:[0.0d,-2.5d,0.0d],Passengers:[{id:"minecraft:armor_stand",NoGravity:1b,Invisible:1b,Tags:["jump_rider_proxy"]}]}'
            sleep 8
            echo 'execute if entity @e[type=minecraft:skeleton_horse,tag=lead_candidate,limit=1] run say GOD_HORSE_LEAD_TARGET_PRESENT'
            echo 'execute if entity @e[type=minecraft:skeleton_horse,tag=normal_control,limit=1] run say NORMAL_HORSE_CONTROL_PRESENT'
            echo 'execute if entity @e[type=minecraft:skeleton_horse,tag=ridden_half,x=20,y=96,z=0,dx=4,dy=2,dz=4] if entity @e[tag=rider_proxy] run say RIDDEN_HALF_RECOVERY_PASS'
            echo 'execute if entity @e[type=minecraft:skeleton_horse,tag=ridden_jump,x=30,y=100,z=0,dx=4,dy=2,dz=4] if entity @e[tag=jump_rider_proxy] run say RIDDEN_JUMP_RECOVERY_PASS'
            echo 'stop'
          } | timeout 100s java -Xms512M -Xmx1G -jar fabric-server-launch.jar nogui > ../full-server-test.log 2>&1
          code=${PIPESTATUS[1]}
          set -e
          cd ..
          cat full-server-test.log
          if grep -Eqi 'Mixin apply failed|InjectionError|InvalidInjectionException|Could not execute entrypoint|Incompatible mods found|NoClassDefFoundError|ClassNotFoundException|VerifyError|Failed to start the minecraft server' full-server-test.log; then exit 1; fi
          grep -Eqi 'godvillagers 0\.1\.0-alpha\.83\+mc26\.2' full-server-test.log
          grep -Eqi 'Done \(' full-server-test.log
          grep -Fq 'GOD_HORSE_LEAD_TARGET_PRESENT' full-server-test.log
          grep -Fq 'NORMAL_HORSE_CONTROL_PRESENT' full-server-test.log
          grep -Fq 'RIDDEN_HALF_RECOVERY_PASS' full-server-test.log
          grep -Fq 'RIDDEN_JUMP_RECOVERY_PASS' full-server-test.log
          if [ "$code" -ne 0 ] && [ "$code" -ne 124 ]; then exit "$code"; fi

      - uses: actions/upload-artifact@v4
        with:
          name: god-villagers-alpha83-lead-horse-regression-verified
          path: |
            build/full/god-villagers-0.1.0-alpha.83+mc26.2.jar
            full-server-test.log
            alpha83-javap.txt
