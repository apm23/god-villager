plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.19'
    id 'maven-publish'
}

version = project.mod_version + '+mc' + project.minecraft_version
group = project.maven_group
base { archivesName = project.archives_base_name }

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

def baselineJar = layout.buildDirectory.file('baseline/god-villagers-alpha73.jar')

tasks.register('decodeBaseline') {
    inputs.files(fileTree('baseline') { include 'god-villagers-alpha73.jar.b64.*' })
    outputs.file(baselineJar)
    doLast {
        def parts = fileTree('baseline') { include 'god-villagers-alpha73.jar.b64.*' }.files.sort { it.name }
        def encoded = parts.collect { it.text.trim() }.join('')
        def out = baselineJar.get().asFile
        out.parentFile.mkdirs()
        out.bytes = Base64.decoder.decode(encoded)
    }
}

tasks.named('jar', Jar) {
    dependsOn tasks.named('decodeBaseline')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    from({ zipTree(baselineJar.get().asFile) }) {
        exclude 'fabric.mod.json'
        exclude 'META-INF/MANIFEST.MF'
        exclude 'src/**'
        exclude 'stubs/**'
        exclude 'stubs*/**'
        exclude 'classes/**'
        exclude 'classes*/**'
        exclude 'com/anjas/godvillagers/GodHorseRuntime.class'
    }

    archiveClassifier = ''
}
